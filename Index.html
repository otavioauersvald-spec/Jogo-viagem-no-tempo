
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paradoxal — Viagem no Tempo</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="game">

    <header>
      <div class="tag">ARQUIVO TEMPORAL // CASO 07</div>
      <h1>PARADOXAL</h1>
      <p class="subtitle">Viagem no Tempo</p>
    </header>

    <section class="status">
      <span id="timeline">LINHA TEMPORAL: 2026-A</span>
      <span id="step">DECISÃO 1</span>
    </section>

    <section class="screen">

      <div id="story"></div>

      <div id="choices" class="choices"></div>

    </section>

    <footer>
      <p>⚠ Cada decisão pode alterar a linha do tempo.</p>

      <button id="restart" class="restart" hidden>
        REINICIAR INVESTIGAÇÃO
      </button>
    </footer>

  </main>

  <script src="script.js"></script>

</body>
</html>
